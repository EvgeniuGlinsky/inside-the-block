[package]
name = "itb"
version = "0.1.0"
edition = "2021"
description = "Inside the Block: measure how Solana mainnet leaders order transactions inside their blocks"
license = "MIT"

[dependencies]
anyhow = "1"
base64 = "0.22"
bincode = "1.3"
bs58 = "0.5"
clap = { version = "4", features = ["derive", "env"] }
futures-util = "0.3"
quinn = { version = "0.11", default-features = false, features = ["runtime-tokio", "rustls-ring"] }
rand = "0.8"
rcgen = "0.13"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
rustls = { version = "0.23", default-features = false, features = ["ring", "std"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
solana-hash = "4"
solana-instruction = "4"
solana-keypair = "4"
solana-message = { version = "6", features = ["serde"] }
solana-pubkey = "4"
solana-signer = "4"
solana-transaction = { version = "6", features = ["serde", "wincode"] }
tokio = { version = "1", features = ["full"] }
tokio-tungstenite = { version = "0.24", default-features = false, features = ["connect", "rustls-tls-webpki-roots"] }

[profile.release]
codegen-units = 4
